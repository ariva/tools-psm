[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "3.0.0"
edition = "2024"
authors = ["Arunas Ivanauskas <arunas.work.hg@gmail.com>"]
license = "MIT"
repository = "https://github.com/ariva/tool-psm"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
libc = "0.2"
procfs = "0.18"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
